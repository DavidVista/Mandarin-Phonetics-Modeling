[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mandarin-phonetics"
version = "0.2.0"
description = "Reproducible character-level Mandarin phonetics experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.1.3", "pypinyin==0.55.0"]

[project.optional-dependencies]
audio = ["soundfile==0.14.0"]
sources = ["datasets>=3,<5"]
training = ["torch==2.11.0"]
inference = ["torch==2.11.0", "transformers>=4.48,<5", "librosa>=0.10,<1", "soundfile==0.14.0"]
test = ["nbformat>=5.10,<6"]

[project.scripts]
phonetics = "phonetics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["phonetics*"]
