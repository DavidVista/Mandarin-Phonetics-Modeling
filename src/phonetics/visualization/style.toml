[schema]
version = 1

[font]
family = "Arial"
axis_label_pt = 9.0
tick_pt = 8.0
legend_pt = 8.0
panel_heading_pt = 9.0
panel_letter_pt = 10.0
annotation_pt = 8.0
normal_weight = "normal"
panel_letter_weight = "bold"

[color]
background = "#FFFFFF"
foreground = "#171717"
secondary = "#666666"
tertiary = "#888888"
quaternary = "#999999"

[line]
data_pt = 1.2
axes_pt = 0.7
reference_pt = 0.7
interval_pt = 0.9
caps_pt = 3.0

[marker]
size_pt = 4.0
edge_pt = 0.8
face = "white"
markevery_target = 10

[layout]
single_width_mm = 90.0
multi_width_mm = 180.0
panel_aspect = 1.3333333333333333
left_mm = 14.0
right_mm = 5.0
bottom_mm = 12.0
top_mm = 8.0
hgap_mm = 14.0
vgap_mm = 16.0
legend_row_mm = 8.0
legend_gap_mm = 3.0
default_columns = [1, 2, 2, 2, 3, 3, 3]

[axes]
grid = false
minor_ticks = false
tick_direction = "in"
major_length_pt = 3.0
major_width_pt = 0.7
major_pad_pt = 3.0
major_target = 5
panel_label_x_mm = -3.0
panel_label_y_mm = 2.0

[legend]
max_per_row = 4
handle_length_em = 2.4
column_spacing_em = 1.2
location = "upper center"

[histogram]
density = true
fill = false
bootstrap_bins = 40

[export]
formats = ["png", "eps"]
dpi = 300
transparent = false
overwrite = false

[backend.rcparams]
"pdf.fonttype" = 42
"ps.fonttype" = 42
"svg.fonttype" = "none"
