[schema]
version = 1

[figures.pilot_ecdf]
status = "approved"
kind = "ecdf"
name = "Cosine distributions"
xlabel = "Cosine similarity"
ylabel = "ECDF"
series = ["base", "zh_cn"]
order = ["base", "zh_cn"]
scale = "linear"
xlim = [-1.0, 1.0]
ylim = [0.0, 1.0]

[figures.pilot_histogram]
status = "approved"
kind = "histogram"
name = "Cosine density"
xlabel = "Cosine similarity"
ylabel = "Density"
series = ["base", "zh_cn"]
order = ["base", "zh_cn"]
scale = "linear"
density = true
xlim = [-1.0, 1.0]
ylim = [0.0]
edges_start = -1.0
edges_stop = 1.0
edges_count = 61

[figures.pilot_bootstrap]
status = "approved"
kind = "bootstrap_histogram"
name = "Bootstrap differences"
xlabel = "Zh-cn \u2212 Base"
ylabel = "Bootstrap repeats"
series = ["delta"]
order = ["delta"]
scale = "linear"
bins = 40
density = false
ylim = [0.0]

[semantics.base]
label = "Base"
color = "#171717"
linestyle = "solid"
marker = "o"

[semantics.zh_cn]
label = "Zh-cn"
color = "#666666"
linestyle = "dashed"
marker = "s"

[semantics.delta]
label = "Zh-cn \u2212 Base"
color = "#171717"
linestyle = "solid"
marker = "o"

[figures.dimsim_distributions]
status = "approved"
kind = "distribution_triptych"
name = "DIMSIM distributions"
xlabel = "DIMSIM distance"
ylabel = "Pair count / ECDF"
series = ["population"]
order = ["population"]
scale = "linear"

[figures.dimsim_overlap_distributions]
status = "approved"
kind = "ecdf"
name = "Component overlap distributions"
xlabel = "DIMSIM distance"
ylabel = "ECDF"
series = ["000", "001", "010", "011", "100", "101", "110", "111"]
order = ["000", "001", "010", "011", "100", "101", "110", "111"]
scale = "linear"
ylim = [0.0, 1.0]

[figures.dimsim_component_contributions]
status = "approved"
kind = "stacked_bar"
name = "DIMSIM component contributions"
xlabel = "DIMSIM interval"
ylabel = "Share of mean DIMSIM distance"
series = ["initial", "final", "tone"]
order = ["initial", "final", "tone"]
scale = "linear"

[semantics.population]
label = "All pairs"
color = "#171717"
linestyle = "solid"
marker = "o"

[semantics.000]
label = "000"
color = "#171717"
linestyle = "solid"
marker = "o"
[semantics.001]
label = "001"
color = "#444444"
linestyle = "dashed"
marker = "s"
[semantics.010]
label = "010"
color = "#666666"
linestyle = "dotted"
marker = "^"
[semantics.011]
label = "011"
color = "#888888"
linestyle = "dashdot"
marker = "v"
[semantics.100]
label = "100"
color = "#303030"
linestyle = "solid"
marker = "D"
[semantics.101]
label = "101"
color = "#606060"
linestyle = "dashed"
marker = "P"
[semantics.110]
label = "110"
color = "#909090"
linestyle = "dotted"
marker = "X"
[semantics.111]
label = "111"
color = "#c0c0c0"
linestyle = "dashdot"
marker = "*"
[semantics.initial]
label = "Initial"
color = "#303030"
linestyle = "solid"
marker = "o"
[semantics.final]
label = "Final"
color = "#888888"
linestyle = "solid"
marker = "s"
[semantics.tone]
label = "Tone"
color = "#d0d0d0"
linestyle = "solid"
marker = "^"

[figures.anchor_q_transitions]
status = "approved"
kind = "dotplot"
name = "Anchor-Q transitions"
xlabel = "Transition"
ylabel = "Anchor-Q"
series = ["syllable", "components", "acoustic", "components-acoustic-lambda-1", "components-acoustic-lambda-10"]
order = ["syllable", "components", "acoustic", "components-acoustic-lambda-1", "components-acoustic-lambda-10"]
scale = "linear"

[figures.transition_shares]
status = "approved"
kind = "stacked_bar"
name = "Transition shares"
xlabel = "Transition"
ylabel = "Q share"
series = ["initial", "final", "tone"]
order = ["initial", "final", "tone"]
scale = "linear"

[figures.component_shares]
status = "approved"
kind = "stacked_bar"
name = "Component shares"
xlabel = "Model"
ylabel = "Q share"
series = ["initial", "final", "tone"]
order = ["initial", "final", "tone"]
scale = "linear"

[figures.dimsim_geometry]
status = "approved"
kind = "line_histogram"
name = "DIMSIM geometry"
xlabel = "DIMSIM distance"
ylabel = "Cosine similarity"
series = ["syllable", "components", "acoustic", "components-acoustic-lambda-1", "components-acoustic-lambda-10"]
order = ["syllable", "components", "acoustic", "components-acoustic-lambda-1", "components-acoustic-lambda-10"]
scale = "linear"

[figures.dimsim_correlation]
status = "approved"
kind = "dotplot"
name = "DIMSIM correlation"
xlabel = "Model"
ylabel = "Spearman rho"
series = ["syllable", "components", "acoustic", "components-acoustic-lambda-1", "components-acoustic-lambda-10"]
order = ["syllable", "components", "acoustic", "components-acoustic-lambda-1", "components-acoustic-lambda-10"]
scale = "linear"

[semantics.syllable]
label = "Syllable"
color = "#171717"
linestyle = "solid"
marker = "o"
[semantics.components]
label = "Components"
color = "#444444"
linestyle = "dashed"
marker = "s"
[semantics.acoustic]
label = "Acoustic"
color = "#707070"
linestyle = "dotted"
marker = "^"
[semantics."components-acoustic-lambda-1"]
label = "Combined \u03bb1"
color = "#999999"
linestyle = "dashdot"
marker = "D"
[semantics."components-acoustic-lambda-10"]
label = "Combined \u03bb10"
color = "#c5c5c5"
linestyle = "solid"
marker = "v"
